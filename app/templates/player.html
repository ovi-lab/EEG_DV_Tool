<!DOCTYPE html>
<html>

<head>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <title>{{ video.title }}</title>
  <link rel="stylesheet" href="/static/player.css">
</head>

<body>
  <h1>{{ video.title }}</h1>
  <div id="viewer-container">
    <div id="viewer-right-child">
      <video controls id="video-player">
        <source src="/static/data/DVs/{{ gaze_video_path if use_gaze else video.video_path }}" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <!-- label for the stimuli to be added -->
      <div id="eeg-viewer">
        <!-- <label class="merge">
          <input type="checkbox" name="merge" value="merge">
          Merge the Selected Participants
        </label> -->
        <canvas id="eegChart" style="width: 100%; height: 100%;"></canvas>
      </div>
    </div>
    <div id="viewer-left-child">
      <button id="sidebarToggle" type="button" title="Hide filters" aria-label="Hide filters" aria-expanded="true">«</button>
      <div id="filters">
        <label id="gazeToggleLabel" style="font-size: 0.9em;{% if not gaze_available %} color: #999;{% endif %}"
          {% if not gaze_available %}title="No {{ gaze_video_path }} in DVs/"{% endif %}>
          <input type="checkbox" id="gazeToggle" {% if use_gaze %}checked{% endif %} {% if not gaze_available %}disabled{% endif %}>
          Show gaze data{% if not gaze_available %} (not available){% endif %}
        </label>
        <div id="videoMessage" style="font-size: 0.85em; color: #b00;"></div>

        <div class="dropdown" id="participantDropdownWrapper">
          <button class="dropdown-btn" id="participantDropdownBtn">All Participants
                <span class="dropdown-icon">▼</span>
          </button>
          <div class="dropdown-content" id="participantDropdown"></div>
        </div>

        <label for="regionFilter" style="font-weight: bold; font-size: 0.9em;">Region:</label>
        <div id="regionFilter" class="region-grid">
          <label class="region frontal">
            <input type="checkbox" name="region" value="frontal">
            Frontal
          </label>
          <label class="region frontocentral">
            <input type="checkbox" name="region" value="frontocentral">
            Frontocentral
          </label>
          <label class="region parietal">
            <input type="checkbox" name="region" value="parietal">
            Parietal
          </label>
          <label class="region occipital">
            <input type="checkbox" name="region" value="occipital">
            Occipital
          </label>
          <label class="region other">
            <input type="checkbox" name="region" value="other">
            Other
          </label>
        </div>

        <label>
          <input type="radio" name="merge" value="merge" id="radio1">
          Merge
        </label>

        <label>
          <input type="radio" name="normalize" value="normalize" id="radio2">
          Normalize
        </label>

        <label for="stimuliFilter" style="font-weight: bold; font-size: 0.9em;">Data Video elements:</label>
        <div id="stimuliCheckboxes" style="display: flex; flex-direction: column; gap: 0.3em; font-size: small;">
          <!-- checkboxes will be generated here -->
        </div>

        <button id="applyFilters">Apply Filters</button>
        <div id="filterMessage" style="font-size: 0.85em; color: #b00; min-height: 1.2em;"></div>
      </div>
    </div>
  </div>
  <input type="hidden" id="videoId" value="{{ video.id }}">
  <script>
    // Helper function to clean data - convert null values to NaN for Chart.js
    function cleanDataForChart(data) {
      if (!Array.isArray(data)) return data;
      return data.map(value => value === null ? NaN : value);
    }

    const SHOW_ATTENTION = {{ show_attention | tojson }};
    const engagementData = cleanDataForChart({{ eng_data | tojson }});
    const attentionData = cleanDataForChart({{ atn_data | tojson }});
    const participantsData = {{ participants | tojson }};
    const stimuli2 = {{ stimuli_info | tojson }};
    const stimuliData = {{ stimuli_data | tojson }};

    const stimuli = {
      0: { "id": 0, "label": "Sound effect", "abbrev": "SE", "color": "#C2CDFF" },
      1: { "id": 1, "label": "Zooming", "abbrev": "ZM", "color": "#FFF3C2" },
      2: { "id": 2, "label": "Pointing", "abbrev": "PT", "color": "#D9F4CD" },
      3: { "id": 3, "label": "Highlighting", "abbrev": "HL", "color": "#C7FAE9" },
      4: { "id": 4, "label": "Gradual Text", "abbrev": "GT", "color": "#FFC2E8" },
      5: { "id": 5, "label": "Gradual appearance", "abbrev": "GA", "color": "#EBD5FF" },
      6: { "id": 6, "label": "Camera Angle", "abbrev": "CA", "color": "#A9CEFF" },
      7: { "id": 7, "label": "Animation", "abbrev": "AN", "color": "#FFADAD" },
      10: { "id": 10, "label": "Data Visualization", "abbrev": "DVIS", "color": "#FFD699" },
      11: { "id": 11, "label": "Size Change", "abbrev": "SC", "color": "#DBD5D5" },
      13: { "id": 13, "label": "Abrupt Transition", "abbrev": "ATR", "color": "#FFB88B" },
      14: { "id": 14, "label": "Gradual Transition", "abbrev": "GTR", "color": "#C5A8FF" },
    }

    const dropdown = document.getElementById('participantDropdown');
    const ctx = document.getElementById('eegChart').getContext('2d');
    const stimuliSelect = document.getElementById('stimuliFilter');
    const container = document.getElementById('stimuliCheckboxes');
    const video = document.getElementById("video-player");

    let currentVideoTime = 0;
    let syncInterval = null;
    let currentRegion = null;
    let currentParticipant = [];   // [] means "no explicit selection" => all participants
    let mergeSelected = false;
    let normalizeSelected = false;

    //Participants
    dropdown.innerHTML = `
      <label>
        <input type="checkbox" name="participant" value="all">
        All
      </label>
    `;

    participantsData.forEach(p => {
      dropdown.innerHTML += `
        <label>
          <input type="checkbox" name="participant" value="${p}">
          ${p}
        </label>
      `;
    });

    document.getElementById('participantDropdownBtn').addEventListener('click', () => {
      document.querySelector('.dropdown').classList.toggle('show');
    });

    const allParticipantsBox = () => dropdown.querySelector('input[value="all"]');
    const individualBoxes = () =>
      Array.from(dropdown.querySelectorAll('input[type="checkbox"]')).filter(cb => cb.value !== 'all');

    // Only the individual boxes carry participant IDs; the "All" box is a
    // control, so it must never end up in the ID list (parseInt('all') = NaN,
    // which the API rejects with a 422).
    function getSelectedParticipants() {
      return individualBoxes()
        .filter(cb => cb.checked)
        .map(cb => parseInt(cb.value, 10))
        .filter(n => !Number.isNaN(n));
    }

    function updateParticipantButtonText() {
      const btn = document.getElementById('participantDropdownBtn');
      const selected = currentParticipant;
      let text;
      if (selected.length === 0 || selected.length === individualBoxes().length) {
        text = 'All Participants';
      } else if (selected.length <= 3) {
        text = selected.map(p => `P${p}`).join(', ');
      } else {
        text = `${selected.length} Participants`;
      }
      btn.innerHTML = `${text} <span class="dropdown-icon">▼</span>`;
    }

    dropdown.addEventListener('change', e => {
      if (e.target.value === 'all') {
        individualBoxes().forEach(cb => { cb.checked = e.target.checked; });
      } else {
        // Keep the "All" box in sync so it never contradicts the individual ones.
        allParticipantsBox().checked = individualBoxes().every(cb => cb.checked);
      }
      currentParticipant = getSelectedParticipants();
      updateParticipantButtonText();
    });

    //Regions
    document.querySelectorAll('#regionFilter input[type="checkbox"]').forEach(checkbox => {
    checkbox.addEventListener('change', () => {
      const selectedRegions = Array.from(
        document.querySelectorAll('#regionFilter input[type="checkbox"]:checked')
      ).map(el => el.value);
    currentRegion = selectedRegions;
  });
});

    //Stimuli
    Object.values(stimuli2).forEach(({ id, label, color }) => {
    const wrapper = document.createElement('label');
    wrapper.style.display = 'flex';
    wrapper.style.alignItems = 'center';
    wrapper.style.padding = '0.3em';
    wrapper.style.border = '1px solid #ccc';
    wrapper.style.borderRadius = '4px';
    wrapper.style.cursor = 'pointer';
    wrapper.style.backgroundColor = '#fff';
    wrapper.style.transition = 'background-color 0.2s';

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.value = id;
    checkbox.style.marginRight = '0.5em';

    checkbox.addEventListener('change', () => {
      wrapper.style.backgroundColor = checkbox.checked ? color : '#fff';
    });

    wrapper.appendChild(checkbox);
    wrapper.appendChild(document.createTextNode(label));
    container.appendChild(wrapper);
  });

    //Radio buttons
    const radio1 = document.getElementById("radio1");
      radio1.addEventListener("click", function(e) {
        if (this.checked && this.wasChecked) {
          this.checked = false;
        }
        this.wasChecked = this.checked;
        mergeSelected = this.checked;
    });

    const radio2 = document.getElementById("radio2");
      radio2.addEventListener("click", function(e) {
        if (this.checked && this.wasChecked) {
          this.checked = false;
        }
        this.wasChecked = this.checked;
        normalizeSelected = this.checked;
    });
    //Video Sync Line Plugin
    const videoSyncLinePlugin = {
      id: 'video-sync-line',
      afterDraw(chart) {
        if (!chart.options.plugins['video-sync-line']?.enabled) return;

        const xScale = chart.scales['x'];
        const ctx = chart.ctx;
        const chartArea = chart.chartArea;

        const x = xScale.getPixelForValue(currentVideoTime);

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(x, chartArea.top);
        ctx.lineTo(x, chartArea.bottom);
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'gray';
        ctx.stroke();
        ctx.restore();
      }
    };

    const stimuliOverlayPlugin = {
      id: 'stimuli-overlay',
      beforeDraw(chart, args, options) {
        const ctx = chart.ctx;
        const xScale = chart.scales['x'];
        const chartArea = chart.chartArea;
        
        if (!options.stimuli || !Array.isArray(options.stimuli)) return;
        const selectedStimuli = options.selectedStimuli || [];

        ctx.save();
        ctx.globalAlpha = 0.5;

        if (selectedStimuli.length === 0) {
          ctx.restore();
          return; // nothing selected, skip drawing
        }

        for (const s of options.stimuli) {
          if (selectedStimuli && selectedStimuli.length > 0 && !selectedStimuli.includes(String(s.stimulus_id))) {
            continue;
          }

          const color = stimuli[s.stimulus_id]?.color || "#cccccc";
          const xStart = xScale.getPixelForValue(s.start_time);
          const xEnd = xScale.getPixelForValue(s.end_time);
          ctx.fillStyle = color;
          ctx.fillRect(xStart, chartArea.top, xEnd - xStart, chartArea.bottom - chartArea.top);
        }

        ctx.restore();
      }
    };

    Chart.register(stimuliOverlayPlugin, videoSyncLinePlugin);
    
    // Step 1: Initialize chart with initial data
    let chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: Array.from({ length: engagementData.length }, (_, i) => i),
        datasets: [{
          label: 'Engagement (all)',
          data: engagementData,
          borderColor: 'brown',
          borderWidth: 1,
          pointRadius: 0,
          tension: 0.3,
          spanGaps: false  // This will break the line at NaN values instead of interpolating
        }, ...(SHOW_ATTENTION ? [{
          label: 'Attention (all)',
          data: attentionData,
          borderColor: 'black',
          borderWidth: 1,
          pointRadius: 0,
          tension: 0.3,
          spanGaps: false  // This will break the line at NaN values instead of interpolating
        }] : [])]
      },
      options: {
        responsive: true,
        // Fill the panel instead of keeping a fixed ratio; otherwise the fixed
        // panel height caps the width and the plot can't use freed-up space.
        maintainAspectRatio: false,
        scales: {
          x: { 
            title: { display: true, text: 'Time (index)' }
          },
          y: { 
            title: { display: true, text: 'Amplitude' },
            // min: 0,
            // max: 18
          } // Within y: {}, add min: 0, max: 3 args to set the scale of the y-axis
        },
        plugins: {
          'stimuli-overlay': {
            stimuli: []
          },
          'video-sync-line': {
            enabled: true
          },
          tooltip: {
            filter: function(tooltipItem) {
              // Hide tooltip for NaN values
              return !isNaN(tooltipItem.parsed.y);
            }
          }
        },
        elements: {
          point: {
            // Don't show points for NaN values
            pointStyle: function(context) {
              const value = context.parsed.y;
              return isNaN(value) ? false : 'circle';
            }
          }
        }
      },
      plugins: [stimuliOverlayPlugin, videoSyncLinePlugin]
    });

    function updateSyncLine() {
      if (video.paused || video.ended) return;
      currentVideoTime = Math.floor(video.currentTime * 2); // EEG index = video time * 2
      chart.update('none'); // prevent animation
    }

    video.addEventListener('play', () => {
      syncInterval = setInterval(updateSyncLine, 100);
    });

    video.addEventListener('pause', () => {
      clearInterval(syncInterval);
      syncInterval = null;
      updateSyncLine(); // ensure line stays on last frame
    });

    video.addEventListener('ended', () => {
      clearInterval(syncInterval);
      syncInterval = null;
      updateSyncLine();
    });

    //Collapsible sidebar
    const viewerContainer = document.getElementById('viewer-container');
    const sidebarToggle = document.getElementById('sidebarToggle');

    function setSidebarCollapsed(collapsed) {
      viewerContainer.classList.toggle('sidebar-collapsed', collapsed);
      sidebarToggle.textContent = collapsed ? '»' : '«';
      const label = collapsed ? 'Show filters' : 'Hide filters';
      sidebarToggle.title = label;
      sidebarToggle.setAttribute('aria-label', label);
      sidebarToggle.setAttribute('aria-expanded', String(!collapsed));
      // Re-measure now rather than waiting on Chart.js's resize detection,
      // which can leave the plot at its old width.
      chart.resize();
    }

    try { setSidebarCollapsed(localStorage.getItem('sidebarCollapsed') === 'true'); } catch (err) {}

    sidebarToggle.addEventListener('click', () => {
      const collapsed = !viewerContainer.classList.contains('sidebar-collapsed');
      setSidebarCollapsed(collapsed);
      try { localStorage.setItem('sidebarCollapsed', String(collapsed)); } catch (err) {}
    });

    //Gaze / original video toggle
    const ORIGINAL_VIDEO_SRC = '/static/data/DVs/{{ video.video_path }}';
    const GAZE_VIDEO_SRC = '/static/data/DVs/{{ gaze_video_path }}';

    // A file whose video codec the browser can't decode (e.g. MPEG-4 Part 2)
    // still plays its audio, but reports no picture size. Say so instead of
    // leaving a blank frame.
    video.addEventListener('loadedmetadata', () => {
      const file = video.currentSrc.split('/').pop();
      document.getElementById('videoMessage').textContent = video.videoWidth === 0
        ? `This browser can't decode the video track of ${file}. Re-encode it to H.264.`
        : '';
    });

    document.getElementById('gazeToggle').addEventListener('change', e => {
      const useGaze = e.target.checked;
      // Swap the file without losing the viewer's place in the video.
      const resumeAt = video.currentTime;
      const wasPlaying = !video.paused && !video.ended;
      video.querySelector('source').src = useGaze ? GAZE_VIDEO_SRC : ORIGINAL_VIDEO_SRC;
      video.load();
      video.addEventListener('loadedmetadata', () => {
        video.currentTime = resumeAt;
        if (wasPlaying) video.play();
      }, { once: true });

      // Keep the choice in the URL (survives reload) and for the index page.
      const url = new URL(window.location);
      if (useGaze) url.searchParams.set('gaze', 'true');
      else url.searchParams.delete('gaze');
      history.replaceState(null, '', url);
      try { localStorage.setItem('useGazeVideos', useGaze ? 'true' : 'false'); } catch (err) {}
    });

    function buildDatasetsFromResult(fetchedData, selectedParticipants) {
      const datasets = [];
      Object.keys(fetchedData).filter(k => k !== 'meta').forEach(key => {
        const entry = fetchedData[key];
        datasets.push({
          label: formatDatasetLabel('Engagement', key, selectedParticipants),
          data: cleanDataForChart(entry.engagement),
          borderColor: getRandomColor(),
          borderWidth: 1,
          pointRadius: 0,
          tension: 0.3,
          spanGaps: false
        });
        if (SHOW_ATTENTION) {
          datasets.push({
            label: formatDatasetLabel('Attention', key, selectedParticipants),
            data: cleanDataForChart(entry.attention),
            borderColor: getRandomColor(),
            borderWidth: 1,
            pointRadius: 0,
            tension: 0.3,
            spanGaps: false
          });
        }
      });
      return datasets;
    }

    // The API names a merged series 'all' regardless of how many participants
    // went into it, so spell out the actual selection instead.
    function mergedParticipantsLabel(selectedParticipants) {
      const selected = selectedParticipants || [];
      if (selected.length === 0 || selected.length === participantsData.length) return 'all';
      return selected.map(p => `P${p}`).join(' + ');
    }

    function formatDatasetLabel(base, key, selectedParticipants) {
      const [id, region] = key.split('_');
      const idLabel = id === 'all' ? mergedParticipantsLabel(selectedParticipants) : `P${id}`;
      return region ? `${base} (${idLabel} - ${region})` : `${base} (${idLabel})`;
    }

    function getRandomColor() {
      var letters = '0123456789ABCDEF';
      var color = '#';
      for (var i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
      }
      return color;
    }

    document.getElementById('applyFilters').addEventListener('click', () => {
      const regionParams = currentRegion;
      const videoId = document.getElementById('videoId').value;
      const participantParams = currentParticipant;
      const normalize = normalizeSelected;

      const filterMessage = document.getElementById('filterMessage');
      filterMessage.textContent = '';

      let merge = mergeSelected;
      if (merge && participantParams.length === 1) {
        // Averaging one participant with themselves is a no-op, and merging
        // would relabel their series as 'all'. Keep the PPID instead.
        merge = false;
        filterMessage.textContent = 'Only one participant selected. Nothing to merge.';
      } else if (!merge && participantParams.length === 0) {
        // No explicit selection: show the group average rather than one line
        // per participant.
        merge = true;
      }

      const selectedStimuli = Array.from(
        document.querySelectorAll('#stimuliCheckboxes input[type="checkbox"]:checked')
      ).map(cb => cb.value);

      const queryParams = new URLSearchParams();
      queryParams.append('video', videoId);
      participantParams.forEach(p => queryParams.append('participant', p));
      console.log("selected participants: ", participantParams);
      if (regionParams) {
        regionParams.forEach(r => queryParams.append('region', r));
      }
      queryParams.append('merge', merge ? 'true' : 'false');
      queryParams.append('normalize', normalize ? 'true' : 'false');

      const eegQuery = `/api/eeg?${queryParams.toString()}`;
      const stimuliQuery = `/api/stimuli?video_id=${videoId}`;

      Promise.all([
        fetch(eegQuery).then(res => {
          if (!res.ok) throw new Error(`EEG request failed (${res.status})`);
          return res.json();
        }),
        fetch(stimuliQuery).then(res => res.json())
      ])
        .then(([eegData, stimuliData]) => {
          chart.data.labels = Array.from({ length: eegData.meta.length }, (_, i) => i);
          chart.data.datasets = buildDatasetsFromResult(eegData, participantParams);
          chart.options.plugins['stimuli-overlay'].stimuli = stimuliData;
          chart.options.plugins['stimuli-overlay'].selectedStimuli = selectedStimuli;
          chart.update();
        })
        .catch(err => {
          console.error("Failed to fetch EEG or stimuli data:", err);
          // Surface it: a silently swallowed error just leaves the previous
          // chart on screen, which looks like the filters did nothing.
          filterMessage.textContent = `Could not load data: ${err.message}`;
        });
    });
  </script>
</body>

</html>
