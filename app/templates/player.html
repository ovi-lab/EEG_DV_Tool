<!DOCTYPE html>
<html>

<head>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <title>{{ video.title }}</title>
  <link rel="stylesheet" href="/static/player.css">
</head>

<body>
  <h1>{{ video.title }}</h1>
  <div id="viewer-container">
    <div id="viewer-right-child">
      <video controls id="video-player">
        <source src="/static/data/mdvs/{{ video.video_path }}" type="video/mp4">
        Your browser does not support the video tag.
      </video>
      <!-- label for the stimuli to be added -->
      <div id="eeg-viewer">
          <canvas id="eegChart" style="width: 100%; height: 100%;"></canvas>
      </div>
    </div>
    <div id="viewer-left-child">
      <div id="filters">

        <div class="dropdown" id="participantDropdownWrapper">
          <button class="dropdown-btn" id="participantDropdownBtn">All Participants
                <span class="dropdown-icon">▼</span>
          </button>
          <div class="dropdown-content" id="participantDropdown"></div>
        </div>

        <label for="regionFilter" style="font-weight: bold; font-size: 0.9em;">Region:</label>
        <div id="regionFilter" class="region-grid">
          <label class="region frontal">
            <input type="checkbox" name="region" value="frontal">
            Frontal
          </label>
          <label class="region frontcentral">
            <input type="checkbox" name="region" value="frontocentral">
            Frontocentral
          </label>
          <label class="region parietal">
            <input type="checkbox" name="region" value="parietal">
            Parietal
          </label>
        </div>

        <label for="stimuliFilter" style="font-weight: bold; font-size: 0.9em;">Stimuli:</label>
        <div id="stimuliCheckboxes" style="display: flex; flex-direction: column; gap: 0.3em; font-size: small;">
          <!-- checkboxes will be generated here -->
        </div>

        <button id="applyFilters">Apply Filters</button>
      </div>
    </div>
  </div>
  <input type="hidden" id="videoId" value="{{ video.id }}">
  <script>
    const engagementData = {{ eng_data | tojson }};
    const attentionData = {{ atn_data | tojson }};
    const participantsData = {{ participants | tojson }};
    const stimuli2 = {{ stimuli_info | tojson }};
    const stimuliData = {{ stimuli_data | tojson }};

    const stimuli = {
    0: {"id": 0, "label": "Sound effect", "color": "#e6194b"},
    1: {"id": 1, "label": "Zoom", "color": "#3cb44b"},
    2: {"id": 2, "label": "Pointing", "color": "#ffe119"},
    3: {"id": 3, "label": "Highlighting", "color": "#0082c8"},
    4: {"id": 4, "label": "Gradual Text", "color": "#f58231"},
    5: {"id": 5, "label": "Gradual appearance", "color": "#911eb4"},
    6: {"id": 6, "label": "Camera Angle", "color": "#46f0f0"},
    7: {"id": 7, "label": "Animation", "color": "#f032e6"},
    8: {"id": 8, "label": "Map", "color": "#d2f53c"},
    9: {"id": 9, "label": "Area", "color": "#fabebe"},
    10: {"id": 10, "label": "Pictograph", "color": "#008080"},
    11: {"id": 11, "label": "Size Change", "color": "#e6beff"},
    }

    const dropdown = document.getElementById('participantDropdown');
    const ctx = document.getElementById('eegChart').getContext('2d');
    const stimuliSelect = document.getElementById('stimuliFilter');
    const container = document.getElementById('stimuliCheckboxes');
    const video = document.getElementById("video-player");

    let currentVideoTime = 0;
    let currentParticipant = null;
    let currentRegion = [];

    //Participants
    dropdown.innerHTML = `
      <label>
        <input type="radio" name="participant" value="all" checked>
        All
      </label>
    `;

    participantsData.forEach(p => {
      dropdown.innerHTML += `
        <label>
          <input type="radio" name="participant" value="${p}">
          ${p}
        </label>
      `;
    });

    document.getElementById('participantDropdownBtn').addEventListener('click', () => {
      document.querySelector('.dropdown').classList.toggle('show');
    });

    dropdown.addEventListener('change', e => {
      const selected = e.target.value;
      if (selected === "all") {
        currentParticipant = null;
      } else {
        currentParticipant = parseInt(selected);
      }
      document.getElementById('participantDropdownBtn').textContent =
        selected === "all" ? "All Participants" : `Participant ${selected}`;
    });

    //Regions
    document.querySelectorAll('#regionFilter input[type="checkbox"]').forEach(checkbox => {
    checkbox.addEventListener('change', () => {
      const selectedRegions = Array.from(
        document.querySelectorAll('#regionFilter input[type="checkbox"]:checked')
      ).map(el => el.value);

    currentRegion = selectedRegions;
  });
});

    //Stimuli
    Object.values(stimuli2).forEach(({ id, label, color }) => {
    const wrapper = document.createElement('label');
    wrapper.style.display = 'flex';
    wrapper.style.alignItems = 'center';
    wrapper.style.padding = '0.3em';
    wrapper.style.border = '1px solid #ccc';
    wrapper.style.borderRadius = '4px';
    wrapper.style.cursor = 'pointer';
    wrapper.style.backgroundColor = '#fff';
    wrapper.style.transition = 'background-color 0.2s';

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.value = id;
    checkbox.style.marginRight = '0.5em';

    checkbox.addEventListener('change', () => {
      wrapper.style.backgroundColor = checkbox.checked ? color : '#fff';
    });

    wrapper.appendChild(checkbox);
    wrapper.appendChild(document.createTextNode(label));
    container.appendChild(wrapper);
  });

    //Video Sync Line Plugin
    const videoSyncLinePlugin = {
      id: 'video-sync-line',
      afterDraw(chart) {
        if (!chart.options.plugins['video-sync-line']?.enabled) return;

        const xScale = chart.scales['x'];
        const ctx = chart.ctx;
        const chartArea = chart.chartArea;

        const x = xScale.getPixelForValue(currentVideoTime);

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(x, chartArea.top);
        ctx.lineTo(x, chartArea.bottom);
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'gray';
        ctx.stroke();
        ctx.restore();
      }
    };

    const stimuliOverlayPlugin = {
      id: 'stimuli-overlay',
      beforeDraw(chart, args, options) {
        const ctx = chart.ctx;
        const xScale = chart.scales['x'];
        const chartArea = chart.chartArea;
        
        if (!options.stimuli || !Array.isArray(options.stimuli)) return;
        const selectedStimuli = options.selectedStimuli || [];

        ctx.save();
        ctx.globalAlpha = 0.3;

        if (selectedStimuli.length === 0) {
          ctx.restore();
          return; // nothing selected, skip drawing
        }

        for (const s of options.stimuli) {
          if (selectedStimuli && selectedStimuli.length > 0 && !selectedStimuli.includes(String(s.stimulus_id))) {
            continue;
          }

          const color = stimuli[s.stimulus_id]?.color || "#cccccc";
          const xStart = xScale.getPixelForValue(s.start_time);
          const xEnd = xScale.getPixelForValue(s.end_time);
          ctx.fillStyle = color;
          ctx.fillRect(xStart, chartArea.top, xEnd - xStart, chartArea.bottom - chartArea.top);
        }

        ctx.restore();
      }
    };

    Chart.register(stimuliOverlayPlugin, videoSyncLinePlugin);
    // Step 1: Initialize chart with initial data
    let chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: Array.from({ length: engagementData.length }, (_, i) => i),
        datasets: [{
          label: 'Engagement',
          data: engagementData,
          borderColor: 'brown',
          borderWidth: 1,
          pointRadius: 0,
          tension: 0.3
        }, {
          label: 'Attention',
          data: attentionData,
          borderColor: 'black',
          borderWidth: 1,
          pointRadius: 0,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        scales: {
          x: { title: { display: true, text: 'Time (index)' } },
          y: { title: { display: true, text: 'Amplitude' } }
        },
        plugins: {
          'stimuli-overlay': {
            stimuli: []
          },
          'video-sync-line': {
            enabled: true
          }
        }
      },
      plugins: [stimuliOverlayPlugin, videoSyncLinePlugin]
    });

    function updateChartWithRegions(selectedRegions, regionData) {
  // Colors for regions
  const colors = {
    frontal: ['red', 'darkred'],
    frontocentral: ['green', 'darkgreen'],
    parietal: ['blue', 'darkblue']
  };

  // Append region datasets
  selectedRegions.forEach(region => {
    if (regionData[region]) {
      chart.data.datasets.push({
        label: `Engagement (${region})`,
        data: regionData[region].engagement,
        borderColor: colors[region][0],
        borderWidth: 1,
        pointRadius: 0,
        tension: 0.3
      });
      chart.data.datasets.push({
        label: `Attention (${region})`,
        data: regionData[region].attention,
        borderColor: colors[region][1],
        borderWidth: 1,
        pointRadius: 0,
        tension: 0.3
      });
    }
  });

  chart.update();
}


    function updateSyncLine() {
      if (video.paused || video.ended) return;
      currentVideoTime = Math.floor(video.currentTime * 2); // EEG index = video time * 2
      chart.update('none'); // prevent animation
    }

    let syncInterval = null;


    video.addEventListener('play', () => {
    syncInterval = setInterval(updateSyncLine, 100);
  });

    video.addEventListener('pause', () => {
      clearInterval(syncInterval);
      syncInterval = null;
      updateSyncLine(); // ensure line stays on last frame
    });

    video.addEventListener('ended', () => {
      clearInterval(syncInterval);
      syncInterval = null;
      updateSyncLine();
    });

    document.getElementById('applyFilters').addEventListener('click', () => {
      const regionParams = currentRegion;
      const videoId = document.getElementById('videoId').value;
      const participantParams = currentParticipant;
      const selectedStimuli = Array.from(
        document.querySelectorAll('#stimuliCheckboxes input[type="checkbox"]:checked')
      ).map(cb => cb.value);
      

      const queryParams = new URLSearchParams();
      queryParams.append('video', videoId);
      if (participantParams) {
        queryParams.append('participant', participantParams);
      }
      if (regionParams) {
        regionParams.forEach(r => queryParams.append('region', r));
      }
      let query = `/api/eeg?${queryParams.toString()}`;
      console.log("EEG Query:", query);

      const stimuliQuery = `/api/stimuli?video_id=${videoId}`;

      Promise.all([
        fetch(query).then(res => res.json()),
        fetch(stimuliQuery).then(res => res.json())
      ])
        .then(([eegData, stimuliData]) => {
          chart.data.labels = Array.from({ length: eegData["all"].engagement.length }, (_, i) => i);
          chart.data.datasets[0].data = eegData["all"].engagement;
          chart.data.datasets[1].data = eegData["all"].attention;
          updateChartWithRegions(currentRegion, eegData);


          // Set new stimuli
          
          chart.options.plugins['stimuli-overlay'].stimuli = stimuliData;
          chart.options.plugins['stimuli-overlay'].selectedStimuli = selectedStimuli;
          chart.update();
        })
        .catch(err => {
          console.error("Failed to fetch EEG or stimuli data:", err);
        });
    });
  </script>
</body>

</html>
